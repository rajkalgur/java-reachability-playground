name: Java CI Security Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3️⃣ Build & run unit tests
      - name: Build and test with Maven
        run: mvn clean verify --batch-mode

      # 4️⃣ Upload JUnit test report (optional)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: target/surefire-reports/*.xml

  sast-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 5️⃣ Static Application Security Testing (SAST)
      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/java
          generateSarif: true

      - nam
